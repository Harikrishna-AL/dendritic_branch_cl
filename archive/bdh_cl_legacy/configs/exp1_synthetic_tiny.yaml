# Step 3 / Experiment 1 on the `tiny` preset: weight-level continual learning
# over the five synthetic algorithmic tasks, BDH vs a parameter-matched GPT.
#
# Step budget calibrated: BDH-tiny reaches exact-match 1.00 on `copy` by
# step 1200 at this batch size (results/logs/calib.log).
name: exp1_synthetic_tiny
family: synthetic
preset: tiny
tasks: [copy, reverse, sort, add, lookup]
models: [gpt, bdh]   # GPT first: 5.6x faster, and it is the comparison arm
strategies: [naive]
seeds: [0]
n_eval: 200
eval_batch_size: 32
probe_batches: 2
save_checkpoints: true
plasticity_target_frac: 0.5
train:
  block_size: 96
  batch_size: 32
  steps_per_task: 1200
  warmup_steps: 100
  eval_every: 150
  log_every: 300
